[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainkit"
version = "0.3.0"
description = "An open-source Python sustainability management toolkit: double materiality, GHG accounting (Scope 1 and 2), stakeholder mapping and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed (DataWithSyed)" }]
keywords = ["sustainability", "ghg", "carbon-accounting", "scope-1", "scope-2", "materiality", "double-materiality", "stakeholder-mapping", "csrd", "esrs", "esg", "gri", "matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business",
]
dependencies = ["pandas>=1.5", "numpy>=1.23", "matplotlib>=3.6", "openpyxl>=3.1"]

[project.optional-dependencies]
interactive = ["plotly>=5.15"]
dev = ["pytest>=7", "plotly>=5.15"]

[project.scripts]
sustainkit = "sustainkit.cli:main"
materiality = "sustainkit.materiality.cli:main"

[project.urls]
Homepage = "https://github.com/DataWithSyed/sustainability-toolkit"
Issues = "https://github.com/DataWithSyed/sustainability-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sustainkit.materiality" = ["data/example/*.xlsx", "data/example/*.csv", "data/example/*.md", "data/example/csv/*.csv"]
"sustainkit.ghg" = ["data/*.csv", "data/example/*.csv", "data/example/*.md"]
"sustainkit.stakeholders" = ["data/example/*.csv", "data/example/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
